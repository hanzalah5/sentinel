# Iteration 3: API + ingestion worker + datastores (Redis for streaming,
# Postgres/pgvector for runbook retrieval).
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      JSON_LOGS: "true"
      DATABASE_URL: "postgresql://sentinel:sentinel@postgres:5432/sentinel"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "sentinel.ingestion.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      JSON_LOGS: "true"
      # Override the localhost defaults so the worker reaches the sibling services.
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://sentinel:sentinel@postgres:5432/sentinel"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
