# Iteration 2: the synchronous API (app) plus an event-driven ingestion worker
# consuming alerts from Redis Streams.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      JSON_LOGS: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "--no-dev", "python", "-m", "sentinel.ingestion.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      JSON_LOGS: "true"
      # Override the localhost default so the worker reaches the redis service.
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
